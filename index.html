<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Medical Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const SUPABASE_URL = 'https://pjgcpjzjrdtsldxmfswz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_zepq7W6RdsZjlqQe3LYksw_G5OSwIt3';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const SquadMedicalTracker = () => {
            const [view, setView] = useState('login');
            const [passwordInput, setPasswordInput] = useState('');
            const [medicalData, setMedicalData] = useState([]);
            const [sortBy, setSortBy] = useState('surname');
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({firstname: '', surname: '', uniqueid: '', allergies: '', currentmeds: '', contactlenses: false, emergencycontact: '', fitnesstoplay: 'Yes', fitnessnotes: ''});

            useEffect(() => {
                if (view === 'staffDashboard') {
                    fetchData();
                }
            }, [view]);

            const fetchData = async () => {
                setLoading(true);
                const { data, error } = await supabase.from('medical_data').select('*').order('timestamp', { ascending: false });
                if (error) {
                    alert('Error loading data: ' + error.message);
                } else {
                    setMedicalData(data || []);
                }
                setLoading(false);
            };

            const handleStaffLogin = (e) => {
                e.preventDefault();
                if (passwordInput === 'MedStaff2024') {
                    setView('staffDashboard');
                } else {
                    alert('Incorrect password');
                }
            };

            const handlePlayerEntry = async (e) => {
                e.preventDefault();
                if (!formData.uniqueid || !formData.firstname || !formData.surname || !formData.allergies) {
                    alert('Please fill in First Name, Surname, Birthday, and Allergies');
                    return;
                }

                setLoading(true);
                const fullName = `${formData.firstname} ${formData.surname}`;
                
                // Check for duplicate names with different birthdays
                const { data: existing } = await supabase
                    .from('medical_data')
                    .select('*')
                    .eq('firstname', formData.firstname)
                    .eq('surname', formData.surname);
                
                const duplicateNames = existing?.filter(e => e.uniqueid !== formData.uniqueid) || [];
                
                if (duplicateNames.length > 0) {
                    const confirmed = window.confirm(`Warning: There is already someone named "${fullName}" with a different birthday.\n\nYour record will be saved under birthday: ${formData.uniqueid}\n\nContinue?`);
                    if (!confirmed) {
                        setLoading(false);
                        return;
                    }
                }

                // Check if updating existing record
                const { data: existingRecord } = await supabase
                    .from('medical_data')
                    .select('*')
                    .eq('firstname', formData.firstname)
                    .eq('surname', formData.surname)
                    .eq('uniqueid', formData.uniqueid)
                    .single();

                if (existingRecord) {
                    // Update existing
                    const { error } = await supabase
                        .from('medical_data')
                        .update({ ...formData, timestamp: new Date().toISOString() })
                        .eq('id', existingRecord.id);
                    if (error) {
                        alert('Error saving data: ' + error.message);
                    } else {
                        alert('Your medical information has been updated. Thank you.');
                        setFormData({firstname: '', surname: '', uniqueid: '', allergies: '', currentmeds: '', contactlenses: false, emergencycontact: '', fitnesstoplay: 'Yes', fitnessnotes: ''});
                        setView('login');
                    }
                } else {
                    // Insert new
                    const { error } = await supabase
                        .from('medical_data')
                        .insert([{ ...formData, timestamp: new Date().toISOString() }]);
                    if (error) {
                        alert('Error saving data: ' + error.message);
                    } else {
                        alert('Your medical information has been saved. Thank you.');
                        setFormData({firstname: '', surname: '', uniqueid: '', allergies: '', currentmeds: '', contactlenses: false, emergencycontact: '', fitnesstoplay: 'Yes', fitnessnotes: ''});
                        setView('login');
                    }
                }
                setLoading(false);
            };

            const formatDate = (isoString) => new Date(isoString).toLocaleDateString('en-GB', {year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});

            const handleDelete = async (id) => {
                if (window.confirm('Delete this player\'s record?')) {
                    setLoading(true);
                    const { error } = await supabase.from('medical_data').delete().eq('id', id);
                    if (error) {
                        alert('Error deleting record: ' + error.message);
                    } else {
                        await fetchData();
                    }
                    setLoading(false);
                }
            };

            const getSortedData = () => {
                const sorted = [...medicalData];
                if (sortBy === 'surname') {
                    sorted.sort((a, b) => a.surname.toLowerCase().localeCompare(b.surname.toLowerCase()));
                } else if (sortBy === 'lastEdited') {
                    sorted.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                }
                return sorted;
            };

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-gradient-to-b from-blue-900 to-blue-700 flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">Squad Medical Tracker</h1>
                            <p className="text-gray-600 mb-6">Rugby League Team</p>
                            <div className="space-y-4 mb-6">
                                <button onClick={() => {setView('playerEntry'); setFormData({firstname: '', surname: '', uniqueid: '', allergies: '', currentmeds: '', contactlenses: false, emergencycontact: '', fitnesstoplay: 'Yes', fitnessnotes: ''});}} className="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700 transition">Player: Enter/Update Information</button>
                                <form onSubmit={handleStaffLogin} className="space-y-3">
                                    <input type="password" placeholder="Staff password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" />
                                    <button type="submit" className="w-full bg-gray-700 text-white py-3 rounded font-semibold hover:bg-gray-800 transition">Medical Staff: View Dashboard</button>
                                </form>
                            </div>
                            <p className="text-xs text-gray-500 text-center">This system stores current medical information only. Full medical records remain with primary care.</p>
                        </div>
                    </div>
                );
            }

            if (view === 'playerEntry') {
                return (
                    <div className="min-h-screen bg-gray-100 p-4">
                        <div className="max-w-2xl mx-auto">
                            <div className="mb-6 flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-gray-900">Update Medical Information</h1>
                                <button onClick={() => setView('login')} className="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition" disabled={loading}>Back</button>
                            </div>
                            <div className="bg-white rounded-lg shadow p-6 mb-4">
                                <p className="text-gray-700 mb-4">Please keep your medical information current.</p>
                                <form onSubmit={handlePlayerEntry} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">First Name *</label>
                                        <input type="text" value={formData.firstname} onChange={(e) => setFormData({...formData, firstname: e.target.value})} placeholder="e.g., John" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">Surname *</label>
                                        <input type="text" value={formData.surname} onChange={(e) => setFormData({...formData, surname: e.target.value})} placeholder="e.g., Smith" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">Date and Month of Your Birthday *</label>
                                        <input type="text" value={formData.uniqueid} onChange={(e) => setFormData({...formData, uniqueid: e.target.value})} placeholder="e.g., 1505 (15th May)" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">Drug Allergies *</label>
                                        <textarea value={formData.allergies} onChange={(e) => setFormData({...formData, allergies: e.target.value})} placeholder="e.g., Penicillin (anaphylaxis) or NKDA" rows="3" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">Current Medications</label>
                                        <textarea value={formData.currentmeds} onChange={(e) => setFormData({...formData, currentmeds: e.target.value})} placeholder="e.g., Metformin 500mg BD" rows="2" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                    </div>
                                    <div className="flex items-center space-x-3">
                                        <input type="checkbox" id="contactlenses" checked={formData.contactlenses} onChange={(e) => setFormData({...formData, contactlenses: e.target.checked})} className="w-4 h-4" disabled={loading} />
                                        <label htmlFor="contactlenses" className="text-gray-900">I wear contact lenses</label>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">Emergency Contact</label>
                                        <input type="text" value={formData.emergencycontact} onChange={(e) => setFormData({...formData, emergencycontact: e.target.value})} placeholder="Name and phone number" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">Currently Fit to Play?</label>
                                        <select value={formData.fitnesstoplay} onChange={(e) => setFormData({...formData, fitnesstoplay: e.target.value})} className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading}>
                                            <option value="Yes">Yes</option>
                                            <option value="No">No</option>
                                            <option value="Conditional">Conditional (see notes)</option>
                                        </select>
                                    </div>
                                    {formData.fitnesstoplay !== 'Yes' && (
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-900 mb-1">Please explain:</label>
                                            <textarea value={formData.fitnessnotes} onChange={(e) => setFormData({...formData, fitnessnotes: e.target.value})} placeholder="e.g., Shoulder injury" rows="2" className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600" disabled={loading} />
                                        </div>
                                    )}
                                    <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700 transition disabled:bg-gray-400" disabled={loading}>{loading ? 'Saving...' : 'Save My Information'}</button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'staffDashboard') {
                return (
                    <div className="min-h-screen bg-gray-100 p-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="mb-6 flex justify-between items-center">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900">Squad Medical Dashboard</h1>
                                    <p className="text-gray-600">{medicalData.length} players on file</p>
                                </div>
                                <div className="flex gap-3 items-center">
                                    <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="px-4 py-2 border border-gray-300 rounded bg-white text-gray-900 focus:outline-none focus:border-blue-600" disabled={loading}>
                                        <option value="surname">Sort by Surname (A-Z)</option>
                                        <option value="lastEdited">Sort by Last Edited</option>
                                    </select>
                                    <button onClick={() => {setPasswordInput(''); setView('login');}} className="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition" disabled={loading}>Logout</button>
                                </div>
                            </div>
                            {loading ? (
                                <div className="bg-white rounded-lg shadow p-8 text-center">
                                    <p className="text-gray-600">Loading data...</p>
                                </div>
                            ) : medicalData.length === 0 ? (
                                <div className="bg-white rounded-lg shadow p-8 text-center">
                                    <p className="text-gray-600">No player records yet.</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {getSortedData().map((entry) => (
                                        <div key={entry.id} className="bg-white rounded-lg shadow p-6">
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <h2 className="text-xl font-bold text-gray-900">{entry.surname}, {entry.firstname}</h2>
                                                    <p className="text-sm text-gray-600">Birthday: {entry.uniqueid}</p>
                                                    <p className="text-xs text-gray-500">Last edited: {formatDate(entry.timestamp)}</p>
                                                </div>
                                                <span className={`px-3 py-1 rounded-full text-sm font-semibold ${entry.fitnesstoplay === 'Yes' ? 'bg-green-100 text-green-800' : entry.fitnesstoplay === 'No' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}`}>Fitness: {entry.fitnesstoplay}</span>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600">DRUG ALLERGIES</p>
                                                    <p className="text-gray-900 font-semibold">{entry.allergies}</p>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600">MEDICATIONS</p>
                                                    <p className="text-gray-900">{entry.currentmeds || '—'}</p>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600">EMERGENCY CONTACT</p>
                                                    <p className="text-gray-900">{entry.emergencycontact || '—'}</p>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600">CONTACT LENSES</p>
                                                    <p className="text-gray-900">{entry.contactlenses ? 'Yes' : 'No'}</p>
                                                </div>
                                            </div>
                                            {entry.fitnessnotes && (
                                                <div className="bg-yellow-50 border border-yellow-200 rounded p-3 mb-4">
                                                    <p className="text-xs font-semibold text-yellow-900">FITNESS NOTES</p>
                                                    <p className="text-yellow-900">{entry.fitnessnotes}</p>
                                                </div>
                                            )}
                                            <button onClick={() => handleDelete(entry.id)} className="text-red-600 hover:text-red-800 text-sm" disabled={loading}>Delete Record</button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<SquadMedicalTracker />);
    </script>
</body>
</html>
