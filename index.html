<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Medical Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SquadMedicalTracker = () => {
            const [view, setView] = useState('login');
            const [staffPassword, setStaffPassword] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [medicalData, setMedicalData] = useState([]);
            const [formData, setFormData] = useState({
                name: '',
                allergies: '',
                currentMeds: '',
                contactLenses: false,
                emergencyContact: '',
                fitnessToPlay: 'Yes',
                fitnessNotes: ''
            });

            useEffect(() => {
                const savedData = localStorage.getItem('squad-medical-data');
                if (savedData) {
                    setMedicalData(JSON.parse(savedData));
                }
            }, []);

            const saveData = (data) => {
                localStorage.setItem('squad-medical-data', JSON.stringify(data));
            };

            const handleStaffLogin = (e) => {
                e.preventDefault();
                if (passwordInput === 'NEMO2022') {
                    setStaffPassword(passwordInput);
                    setView('staffDashboard');
                } else {
                    alert('Incorrect password');
                }
            };

            const handlePlayerEntry = (e) => {
                e.preventDefault();
                
                if (!formData.name || !formData.allergies) {
                    alert('Please fill in at least name and allergies');
                    return;
                }

                const newEntry = {
                    ...formData,
                    timestamp: new Date().toISOString(),
                    id: Date.now()
                };

                const updated = [
                    ...medicalData.filter(entry => entry.name.toLowerCase() !== formData.name.toLowerCase()),
                    newEntry
                ];

                saveData(updated);
                setMedicalData(updated);
                
                setFormData({
                    name: '',
                    allergies: '',
                    currentMeds: '',
                    contactLenses: false,
                    emergencyContact: '',
                    fitnessToPlay: 'Yes',
                    fitnessNotes: ''
                });
                
                alert('Your medical information has been saved. Thank you.');
            };

            const formatDate = (isoString) => {
                return new Date(isoString).toLocaleDateString('en-GB', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            const handleDelete = (id) => {
                if (window.confirm('Delete this player\'s record?')) {
                    const updated = medicalData.filter(entry => entry.id !== id);
                    saveData(updated);
                    setMedicalData(updated);
                }
            };

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-gradient-to-b from-blue-900 to-blue-700 flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
                            <h1 className="text-2xl font-bold text-gray-900 mb-2">Squad Medical Tracker</h1>
                            <p className="text-gray-600 mb-6">Rugby League Team</p>

                            <div className="space-y-4 mb-6">
                                <button
                                    onClick={() => setView('playerEntry')}
                                    className="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700 transition"
                                >
                                    Player: Enter/Update Information
                                </button>

                                <form onSubmit={handleStaffLogin} className="space-y-3">
                                    <input
                                        type="password"
                                        placeholder="Staff password"
                                        value={passwordInput}
                                        onChange={(e) => setPasswordInput(e.target.value)}
                                        className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                    />
                                    <button
                                        type="submit"
                                        className="w-full bg-gray-700 text-white py-3 rounded font-semibold hover:bg-gray-800 transition"
                                    >
                                        Medical Staff: View Dashboard
                                    </button>
                                </form>
                            </div>

                            <p className="text-xs text-gray-500 text-center">
                                This system stores current medical information only. Full medical records remain with primary care.
                            </p>
                        </div>
                    </div>
                );
            }

            if (view === 'playerEntry') {
                return (
                    <div className="min-h-screen bg-gray-100 p-4">
                        <div className="max-w-2xl mx-auto">
                            <div className="mb-6 flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-gray-900">Update Medical Information</h1>
                                <button
                                    onClick={() => setView('login')}
                                    className="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition"
                                >
                                    Back
                                </button>
                            </div>

                            <div className="bg-white rounded-lg shadow p-6 mb-4">
                                <p className="text-gray-700 mb-4">
                                    Please keep your medical information current. This helps us support you in an emergency.
                                </p>

                                <form onSubmit={handlePlayerEntry} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">
                                            Your Full Name *
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            placeholder="e.g., John Smith"
                                            className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">
                                            Drug Allergies *
                                        </label>
                                        <textarea
                                            value={formData.allergies}
                                            onChange={(e) => setFormData({...formData, allergies: e.target.value})}
                                            placeholder="e.g., Penicillin (anaphylaxis), Ibuprofen (GI upset) — or 'NKDA' if none"
                                            rows="3"
                                            className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">
                                            Current Medications
                                        </label>
                                        <textarea
                                            value={formData.currentMeds}
                                            onChange={(e) => setFormData({...formData, currentMeds: e.target.value})}
                                            placeholder="e.g., Metformin 500mg BD, Ramipril 5mg daily — or leave blank if none"
                                            rows="2"
                                            className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                        />
                                    </div>

                                    <div className="flex items-center space-x-3">
                                        <input
                                            type="checkbox"
                                            id="contactLenses"
                                            checked={formData.contactLenses}
                                            onChange={(e) => setFormData({...formData, contactLenses: e.target.checked})}
                                            className="w-4 h-4"
                                        />
                                        <label htmlFor="contactLenses" className="text-gray-900">
                                            I wear contact lenses
                                        </label>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">
                                            Emergency Contact
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.emergencyContact}
                                            onChange={(e) => setFormData({...formData, emergencyContact: e.target.value})}
                                            placeholder="Name and phone number"
                                            className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-900 mb-1">
                                            Currently Fit to Play?
                                        </label>
                                        <select
                                            value={formData.fitnessToPlay}
                                            onChange={(e) => setFormData({...formData, fitnessToPlay: e.target.value})}
                                            className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                        >
                                            <option value="Yes">Yes</option>
                                            <option value="No">No</option>
                                            <option value="Conditional">Conditional (see notes)</option>
                                        </select>
                                    </div>

                                    {formData.fitnessToPlay !== 'Yes' && (
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-900 mb-1">
                                                Please explain briefly:
                                            </label>
                                            <textarea
                                                value={formData.fitnessNotes}
                                                onChange={(e) => setFormData({...formData, fitnessNotes: e.target.value})}
                                                placeholder="e.g., Shoulder injury, awaiting imaging; Minor ankle sprain, expected back in 2 weeks"
                                                rows="2"
                                                className="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-600"
                                            />
                                        </div>
                                    )}

                                    <button
                                        type="submit"
                                        className="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700 transition"
                                    >
                                        Save My Information
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'staffDashboard') {
                return (
                    <div className="min-h-screen bg-gray-100 p-4">
                        <div className="max-w-6xl mx-auto">
                            <div className="mb-6 flex justify-between items-center">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-900">Squad Medical Dashboard</h1>
                                    <p className="text-gray-600">{medicalData.length} players on file</p>
                                </div>
                                <button
                                    onClick={() => {
                                        setStaffPassword('');
                                        setPasswordInput('');
                                        setView('login');
                                    }}
                                    className="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition"
                                >
                                    Logout
                                </button>
                            </div>

                            {medicalData.length === 0 ? (
                                <div className="bg-white rounded-lg shadow p-8 text-center">
                                    <p className="text-gray-600">No player records yet.</p>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    {medicalData.map((entry) => (
                                        <div key={entry.id} className="bg-white rounded-lg shadow p-6">
                                            <div className="flex justify-between items-start mb-4">
                                                <div>
                                                    <h2 className="text-xl font-bold text-gray-900">{entry.name}</h2>
                                                    <p className="text-xs text-gray-500">
                                                        Last updated: {formatDate(entry.timestamp)}
                                                    </p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <span className={`px-3 py-1 rounded-full text-sm font-semibold ${
                                                        entry.fitnessToPlay === 'Yes' 
                                                            ? 'bg-green-100 text-green-800' 
                                                            : entry.fitnessToPlay === 'No'
                                                            ? 'bg-red-100 text-red-800'
                                                            : 'bg-yellow-100 text-yellow-800'
                                                    }`}>
                                                        Fitness: {entry.fitnessToPlay}
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600 uppercase">Drug Allergies</p>
                                                    <p className="text-gray-900 font-semibold">{entry.allergies}</p>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600 uppercase">Current Medications</p>
                                                    <p className="text-gray-900">{entry.currentMeds || '—'}</p>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600 uppercase">Emergency Contact</p>
                                                    <p className="text-gray-900">{entry.emergencyContact || '—'}</p>
                                                </div>
                                                <div>
                                                    <p className="text-xs font-semibold text-gray-600 uppercase">Contact Lenses</p>
                                                    <p className="text-gray-900">{entry.contactLenses ? 'Yes' : 'No'}</p>
                                                </div>
                                            </div>

                                            {entry.fitnessNotes && (
                                                <div className="bg-yellow-50 border border-yellow-200 rounded p-3 mb-4">
                                                    <p className="text-xs font-semibold text-yellow-900 uppercase mb-1">Fitness Notes</p>
                                                    <p className="text-yellow-900">{entry.fitnessNotes}</p>
                                                </div>
                                            )}

                                            <button
                                                onClick={() => handleDelete(entry.id)}
                                                className="text-red-600 hover:text-red-800 text-sm transition"
                                            >
                                                Delete Record
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="mt-8 bg-blue-50 border border-blue-200 rounded-lg p-4">
                                <p className="text-xs text-blue-800">
                                    <strong>Data Retention:</strong> Archive player records 3-6 months after they leave the squad. 
                                    This system holds operational snapshots only; full medical records remain with primary care.
                                </p>
                            </div>
                        </div>
                    </div>
                );
            }
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<SquadMedicalTracker />);
    </script>
</body>
</html>
